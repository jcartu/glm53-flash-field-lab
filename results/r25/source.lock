qualification.hardware=Four NVIDIA RTX PRO 6000 Blackwell Workstation Edition GPUs, physical indices 4 through 7, at stock clocks
qualification.long-prefix.conditions=TP4/DCP4, 4096-token scheduler budget, engine-driven pinned shared memory, CKV gather disabled to exercise the maximum-capacity DCP query-all-gather case, and deterministic cold, GPU-prefix, RAM-L1, and filesystem-L2 requests
qualification.performance.conditions=TP4/DCP4 full-CKV prefill, 4096-token scheduler budget, automatic 1024-token target and recurrent pages, 16 NCCL channels, a 2097152-byte NCCL buffer, asynchronous engine-driven LMCache, and stock GPU clocks
qualification.unit-tests=155 session, engine-driven transfer, missing-registration, and Blend tests passed; 6 device-specific tests were skipped
qualification.modes=FP8 no-speculation, FP8 MTP3, FP8 DFlash2 K7, and NVFP4 no-speculation passed 50000-token tier qualification
qualification.dflash=The FP8 DFlash2 runtime registered all nine hybrid cache groups and restored 49152 of 50025 prompt tokens from RAM-L1 and filesystem-L2
qualification.long-prefix=Five 1000000-token filesystem-L2 replays restored 999424 tokens and recomputed 576 tokens in 1.028 to 1.048 seconds; median 1.041 seconds
qualification.performance=The 1.041-second replay median is 18.3 percent below the 1.274-second base median and 14.4 percent below the 1.216-second single-view-only median
qualification.full-ckv-performance=The release image measured 12394 prompt tokens per second for the 32k DFlash2 prefill cell and 81.1 verifier steps per second for context-zero DFlash2 decode; the R24 base measured 12397 prompt tokens per second and 81.45 verifier steps per second under matched conditions
qualification.restart-l2=After restarting both vLLM and the LMCache sidecar, the release image restored 999424 of 1000000 prompt tokens from filesystem L2 in 1.311 seconds, recomputed 576 tokens, used zero local-prefix-cache tokens, and reproduced the reference greedy output
qualification.transport=The profiled server restore completed in 53 ms; per-worker prepare RPC measured 13.7 to 15.9 ms, commit RPC measured 2.1 to 7.4 ms, and retrieve RPC plus GPU scatter measured 110 to 140 ms
