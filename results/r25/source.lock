lmcache.behavior=Engine-driven pinned-SHM retrieval reuses each reserved tensor view and references chunk hashes retained by the active lookup session; missing-registration prepare failures release exactly one lookup-owned reader share, and unregister owns pending-read cleanup before a rejected late commit; capability negotiation preserves the complete-key protocol for servers that do not advertise session references

